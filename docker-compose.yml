version: "3.8"

services:
  mongodb:
    image: mongo:latest
    container_name: mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
  backend:
    build: ./backend
    container_name: taskboard-backend
    ports:
      - "8081:8081"
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: taskboard-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
